name: CI — Windows (.NET 10 LTS & WinUI 3)

on:
  push:
    branches: [main, develop]
    paths:
      - 'windows/**'
      - '.github/workflows/ci-windows.yml'
  pull_request:
    paths:
      - 'windows/**'

permissions:
  contents: read

jobs:
  windows-ci:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore Solution
        run: dotnet restore RynSpeed.sln
      - name: Build Windows Core & Feature Libraries
        run: |
          dotnet build RynSpeed.Core/RynSpeed.Core.csproj --configuration Release --no-restore
          dotnet build RynSpeed.Security/RynSpeed.Security.csproj --configuration Release --no-restore
          dotnet build RynSpeed.Database/RynSpeed.Database.csproj --configuration Release --no-restore
          dotnet build RynSpeed.Downloads/RynSpeed.Downloads.csproj --configuration Release --no-restore
          dotnet build RynSpeed.Browser/RynSpeed.Browser.csproj --configuration Release --no-restore
          dotnet build RynSpeed.Network/RynSpeed.Network.csproj --configuration Release --no-restore
