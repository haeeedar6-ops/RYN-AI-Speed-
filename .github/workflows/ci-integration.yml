name: CI — End-to-End Integration & Performance

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  e2e-and-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Test Dependencies
        run: pip install cryptography pyyaml
      - name: Run Contract Validation
        run: python scripts/validate_contracts.py
      - name: Run End-to-End Integration & Performance Suite
        run: python -m unittest tests/integration/test_e2e_and_performance.py -v
