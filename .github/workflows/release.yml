name: Release — Signed Android APK & Windows Installer (SemVer)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Verification Dependencies
        run: pip install cryptography pyyaml
      - name: Gate 1 — Shared Contracts & Schemas
        run: python scripts/validate_contracts.py
      - name: Gate 2 — Security & Privacy Audit Suite
        run: python -m unittest tests/security/test_security_audit.py -v
      - name: Gate 3 — End-to-End Integration & Performance Suite
        run: python -m unittest tests/integration/test_e2e_and_performance.py -v

  build-android-release:
    needs: pre-release-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode Signing Keystore (Secrets Only)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Release keystore decoded."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; building installable Debug APK alongside Release APK."
          fi
      - name: Build Android Installable APK (Debug + Release)
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Generate SHA-256 Checksums
        run: sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk > ../android-sha256.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android-sha256.txt

  build-windows-release:
    needs: pre-release-gates
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build Release Libraries
        run: |
          dotnet restore RynSpeed.sln
          dotnet build RynSpeed.Core/RynSpeed.Core.csproj -c Release --no-restore
          dotnet build RynSpeed.Security/RynSpeed.Security.csproj -c Release --no-restore
          dotnet build RynSpeed.Database/RynSpeed.Database.csproj -c Release --no-restore
          dotnet build RynSpeed.Downloads/RynSpeed.Downloads.csproj -c Release --no-restore
          dotnet build RynSpeed.Browser/RynSpeed.Browser.csproj -c Release --no-restore
          dotnet build RynSpeed.Network/RynSpeed.Network.csproj -c Release --no-restore
          dotnet build RynSpeed.VPN/RynSpeed.VPN.csproj -c Release --no-restore
          dotnet build RynSpeed.AI/RynSpeed.AI.csproj -c Release --no-restore

  publish-github-release:
    needs: [build-android-release, build-windows-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create Signed GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE_NOTES_v1.0.0.md
          files: release-artifacts/**/*
          draft: false
          prerelease: false
