openapi: 3.1.0
info:
  title: RYN-AI-Speed Backend API
  version: 1.0.0
  description: >
    Central Backend API for RYN-AI-Speed v2.0 (Android + Windows).
    Enforces HTTPS TLS 1.3, Ed25519 JWT access tokens, refresh token rotation with reuse detection,
    signed VPN server manifests, and sandboxed AI routing.
servers:
  - url: https://api.ryn-ai-speed.example/api/v1
    description: Production HTTPS TLS 1.3 Endpoint

security:
  - BearerEd25519Auth: []

paths:
  /auth/register:
    post:
      summary: Register a new user account
      operationId: registerUser
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'

  /auth/login:
    post:
      summary: Authenticate user and register device session
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'

  /auth/refresh:
    post:
      summary: Rotate refresh token and issue fresh access token
      operationId: refreshTokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'

  /auth/logout:
    post:
      summary: Revoke active device session token family
      operationId: logoutUser
      responses:
        '204':
          description: Session revoked cleanly
        '401':
          $ref: '#/components/responses/ProblemResponse'

  /servers:
    get:
      summary: List verified Private and Community WireGuard VPN servers
      operationId: listVpnServers
      parameters:
        - name: country
          in: query
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
        - name: server_type
          in: query
          schema:
            type: string
            enum: [PRIVATE, COMMUNITY]
      responses:
        '200':
          description: Signed list of verified WireGuard servers
          headers:
            X-Manifest-Signature:
              description: Ed25519 detached signature over canonical response payload
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [servers, generated_at]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/VpnServer'
                  generated_at:
                    type: string
                    format: date-time

  /servers/health:
    get:
      summary: Live health and capacity metrics for VPN servers
      operationId: getServersHealth
      responses:
        '200':
          description: Server health summary
          content:
            application/json:
              schema:
                type: object
                required: [items, checked_at]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VpnServerHealth'
                  checked_at:
                    type: string
                    format: date-time

  /servers/{id}:
    get:
      summary: Get details for a specific verified VPN server
      operationId: getVpnServerById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 64
      responses:
        '200':
          description: VPN server record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpnServer'
        '404':
          $ref: '#/components/responses/ProblemResponse'

  /ai/chat:
    post:
      summary: Route sanitized user prompt through Multi-Provider AI Router
      operationId: aiChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
      responses:
        '200':
          description: AI response and optional proposed tool calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'

  /ai/action:
    post:
      summary: Validate and authorize a sandboxed AI tool invocation
      operationId: authorizeAiAction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiActionRequest'
      responses:
        '200':
          description: Authorization decision for requested tool call
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiActionResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'

  /config:
    get:
      summary: Fetch global application configuration and policy versions
      operationId: getAppConfig
      responses:
        '200':
          description: Application configuration payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'

  /version:
    get:
      summary: Fetch latest signed release info for Android or Windows
      operationId: getLatestVersion
      security: []
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [ANDROID, WINDOWS]
      responses:
        '200':
          description: Signed release metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionResponse'

components:
  securitySchemes:
    BearerEd25519Auth:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA / Ed25519)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ProblemResponse:
      description: RFC 9457 Problem Details error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, error_code, request_id]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        error_code:
          type: string
        request_id:
          type: string
          format: uuid

    RegisterRequest:
      type: object
      required: [email, password, device_uuid, platform, device_name, app_version]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          maxLength: 80
        device_uuid:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ANDROID, WINDOWS]
        device_name:
          type: string
          maxLength: 80
        app_version:
          type: string

    LoginRequest:
      type: object
      required: [email, password, device_uuid, platform, app_version]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
        device_uuid:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ANDROID, WINDOWS]
        app_version:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token, device_uuid]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 32
        device_uuid:
          type: string
          format: uuid

    AuthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in_sec]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in_sec:
          type: integer
          example: 900

    VpnServer:
      type: object
      required:
        - server_id
        - server_name
        - country
        - region
        - endpoint
        - public_key
        - protocol
        - server_type
        - capacity_status
        - health_status
        - provider
        - privacy_policy_url
        - last_checked
      properties:
        server_id:
          type: string
        server_name:
          type: string
        country:
          type: string
          pattern: '^[A-Z]{2}$'
        region:
          type: string
        endpoint:
          type: string
        public_key:
          type: string
        protocol:
          type: string
          enum: [wireguard]
        server_type:
          type: string
          enum: [PRIVATE, COMMUNITY]
        capacity_status:
          type: string
          enum: [LOW, MEDIUM, HIGH, FULL, UNKNOWN]
        health_status:
          type: string
          enum: [HEALTHY, DEGRADED, OFFLINE, UNKNOWN]
        latency_ms:
          type: [integer, 'null']
        packet_loss_pct:
          type: [number, 'null']
        provider:
          type: string
        privacy_policy_url:
          type: string
          format: uri
        last_checked:
          type: string
          format: date-time

    VpnServerHealth:
      type: object
      required: [server_id, health_status, capacity_status, last_checked]
      properties:
        server_id:
          type: string
        health_status:
          type: string
          enum: [HEALTHY, DEGRADED, OFFLINE, UNKNOWN]
        capacity_status:
          type: string
          enum: [LOW, MEDIUM, HIGH, FULL, UNKNOWN]
        latency_ms:
          type: [integer, 'null']
        packet_loss_pct:
          type: [number, 'null']
        last_checked:
          type: string
          format: date-time

    AiChatRequest:
      type: object
      required: [session_id, message, language]
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        message:
          type: string
          minLength: 1
          maxLength: 4000
        language:
          type: string
          enum: [ar, en]
        preferred_provider:
          type: string
          enum: [AUTO, OPENAI, GEMINI, ANTHROPIC, LOCAL_COMPAT]
        sanitized_context:
          type: object
          description: Minimal non-PII telemetry snapshot (no raw URLs, keys, or passwords)

    AiToolCallProposal:
      type: object
      required: [tool_name, arguments, permission_level, requires_confirmation]
      properties:
        tool_name:
          type: string
        arguments:
          type: object
        permission_level:
          type: string
          enum: [READ, SAFE_ACTION, PROTECTED_ACTION]
        requires_confirmation:
          type: boolean

    AiChatResponse:
      type: object
      required: [reply, provider_used, proposed_tools]
      properties:
        reply:
          type: string
        provider_used:
          type: string
          description: Provider that actually produced the reply (LOCAL_RULES until external providers are integrated).
        requested_provider:
          type: string
          description: Provider the client asked for (AUTO if unavailable).
        proposed_tools:
          type: array
          items:
            $ref: '#/components/schemas/AiToolCallProposal'

    AiActionRequest:
      type: object
      required: [tool_name, arguments]
      additionalProperties: false
      properties:
        tool_name:
          type: string
        arguments:
          type: object
        user_confirmation_nonce:
          type: [string, 'null']
          description: Mandatory single-use confirmation token for PROTECTED_ACTION tools

    AiActionResponse:
      type: object
      required: [authorized, permission_level, audit_id]
      properties:
        authorized:
          type: boolean
        permission_level:
          type: string
          enum: [READ, SAFE_ACTION, PROTECTED_ACTION]
        reason:
          type: string
        audit_id:
          type: string
          format: uuid

    AppConfigResponse:
      type: object
      required: [policy_version, feature_flags, ai_providers_enabled]
      properties:
        policy_version:
          type: string
        feature_flags:
          type: object
        ai_providers_enabled:
          type: array
          items:
            type: string

    AppVersionResponse:
      type: object
      required: [platform, latest_version, min_supported_version, download_url, checksum_sha256, signature_ed25519, release_notes_md]
      properties:
        platform:
          type: string
          enum: [ANDROID, WINDOWS]
        latest_version:
          type: string
        min_supported_version:
          type: string
        download_url:
          type: string
          format: uri
        checksum_sha256:
          type: string
        signature_ed25519:
          type: string
        release_notes_md:
          type: string
