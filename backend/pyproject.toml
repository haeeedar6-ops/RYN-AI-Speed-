[project]
name = "ryn-ai-speed-backend"
version = "1.0.0"
description = "RYN-AI-Speed v2.0 Central Backend (FastAPI + PostgreSQL + Redis)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
